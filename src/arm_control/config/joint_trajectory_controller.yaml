# 关节轨迹控制器配置
# arm_control/config/joint_trajectory_controller.yaml

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false

    constraints:
      joint_1:
        trajectory: 0.1
        goal: 0.02
      joint_2:
        trajectory: 0.1
        goal: 0.02
      joint_3:
        trajectory: 0.1
        goal: 0.02
      joint_4:
        trajectory: 0.1
        goal: 0.02
      joint_5:
        trajectory: 0.1
        goal: 0.02
      joint_6:
        trajectory: 0.1
        goal: 0.02

      goal_time: 1.0
      stopped_velocity_tolerance: 0.01

gripper_controller:
  ros__parameters:
    joint: gripper_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 100.0
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
